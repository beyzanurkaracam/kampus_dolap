apiVersion: apps/v1
kind: Deployment
metadata:
  name: kampusumden-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kampusumden-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: kampusumden-backend
    spec:
      containers:
        - name: backend
          image: kampusumden-backend
          envFrom:
            - secretRef:
                name: kampusumden-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          startupProbe:
            httpGet: 
              path: /api/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 5