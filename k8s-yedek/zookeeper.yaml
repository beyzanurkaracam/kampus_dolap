# 1. BÖLÜM: Zookeeper Askeri
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: bitnamilegacy/zookeeper:3.8
        env:
          - name: ALLOW_ANONYMOUS_LOGIN
            value: "yes" # Geliştirme ortamı için şifresiz girişe izin veriyoruz
        ports:
        - containerPort: 2181

---
# 2. BÖLÜM: Zookeeper Trafik Polisi (Service)
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service # Kafka, bu isimle Zookeeper'ı bulacak!
spec:
  selector:
    app: zookeeper
  ports:
    - protocol: TCP
      port: 2181
      targetPort: 2181