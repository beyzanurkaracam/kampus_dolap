version: 2
updates:
  # Mobile (React Native) — repo root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mobile-dependencies:
        patterns: ["*"]

  # Backend (NestJS)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: []
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-dependencies:
        patterns: ["*"]

  # Backend container image
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels: []
    groups:
      docker-dependencies:
        patterns: ["*"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: []
    groups:
      ci-cd-dependencies:
        patterns: ["*"]
