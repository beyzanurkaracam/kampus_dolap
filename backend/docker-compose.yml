services:
  # 1. PostgreSQL (İlişkisel Veritabanı)
  postgres:
    image: postgres:16
    container_name: kampus_dolap_pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: beyza123
      POSTGRES_DB: kampus_dolap_db
    ports:
      - "5432:5432"
    volumes:
      - pg_new_data:/var/lib/postgresql/data

  # 2. Redis (Hız, Önbellek ve Socket.io adaptörü)
  redis:
    image: redis:alpine
    container_name: dolap_redis
    ports:
      - "6379:6379"

  # 3. Zookeeper (Kafka'nın Yönetimi için Şart)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dolap_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 4. Kafka (Mesaj Kuyruk Sistemi)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dolap_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pg_new_data: