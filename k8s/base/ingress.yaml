apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kampusumden-ingress
  annotations:
    networking.gke.io/managed-certificates: "kampusumden-managed-cert"
spec:
  ingressClassName: "gce"
  rules:
    - host: api.kampusumden.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kampusumden-backend-service
                port:
                  number: 80
