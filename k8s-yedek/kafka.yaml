# 1. BÖLÜM: Kafka Askeri
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: bitnamilegacy/kafka:3.4
        env:
          - name: KAFKA_BROKER_ID
            value: "1"
          # DİKKAT: Kafka, K8s içindeki Zookeeper'a bu adresle bağlanıyor:
          - name: KAFKA_CFG_ZOOKEEPER_CONNECT
            value: "zookeeper-service:2181" 
          - name: ALLOW_PLAINTEXT_LISTENER
            value: "yes"
          - name: KAFKA_CFG_LISTENERS
            value: "PLAINTEXT://:9092"
          # DİKKAT: Senin uygulamanın Kafka'yı bulacağı K8s dahili adresi:
          - name: KAFKA_CFG_ADVERTISED_LISTENERS
            value: "PLAINTEXT://kafka-service:9092"
        ports:
        - containerPort: 9092

---
# 2. BÖLÜM: Kafka Trafik Polisi (Service)
apiVersion: v1
kind: Service
metadata:
  name: kafka-service # Senin backend uygulaman bu ismi arayacak!
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092